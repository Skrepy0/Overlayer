plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url 'https://jitpack.io' }
    maven {
        name = "MavenCentral"
        url = "https://repo.maven.apache.org/maven2/"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    implementation('com.github.dragon66:icafe:icafe4j-v0.2') {
        exclude group: 'javax.media', module: 'jai_imageio'
    }
    implementation platform("org.lwjgl:lwjgl-bom:3.4.3")

    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-tinyfd"
    implementation('com.github.dragon66:icafe:icafe4j-v0.2') {
        exclude group: 'javax.media', module: 'jai_imageio'
    }
    def lwjglNatives = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "natives-windows" :
            org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "natives-macos" :
                    "natives-linux"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd::$lwjglNatives"
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    shadowBundle "com.github.dragon66:icafe:icafe4j-v0.2"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

def generatedResources = file("src/generated")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

loom {
    runs {
        clientData {
            clientData()
            programArg "--all"
            programArg "--mod"
            programArg "overlayer"
            programArg "--output"
            programArg file("src/generated").absolutePath
        }
        serverData {
            serverData()
            programArg "--all"
            programArg "--mod"
            programArg "overlayer"
            programArg "--output"
            programArg file("src/generated").absolutePath
        }
    }
}