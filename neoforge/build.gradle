plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url 'https://jitpack.io' }
    maven {
        name = "MavenCentral"
        url = "https://repo.maven.apache.org/maven2/"
    }
}

def os = org.gradle.internal.os.OperatingSystem.current()
def lwjglNatives = os.isWindows() ? "natives-windows" :
        os.isMacOsX() ? "natives-macos" :
                "natives-linux"

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // 编译期依赖
    implementation platform("org.lwjgl:lwjgl-bom:$rootProject.lwjgl_version")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-tinyfd"

    include "org.lwjgl:lwjgl:$rootProject.lwjgl_version"
    include "org.lwjgl:lwjgl:$rootProject.lwjgl_version:$lwjglNatives"
    include "org.lwjgl:lwjgl-tinyfd:$rootProject.lwjgl_version"
    include "org.lwjgl:lwjgl-tinyfd:$rootProject.lwjgl_version:$lwjglNatives"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    shadowBundle("com.github.dragon66:icafe:icafe4j-v0.2") {
        exclude group: 'javax.media', module: 'jai_imageio'
        exclude group: 'org.slf4j'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/native-image/**'
    exclude 'META-INF/maven/**'

    minimize {
        exclude(dependency('com.github.dragon66:icafe:.*'))
    }
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

loom {
    runs {
        clientData {
            clientData()
            programArg "--all"
            programArg "--mod"
            programArg "overlayer"
            programArg "--output"
            programArg file("src/generated/resources").absolutePath
        }
        serverData {
            serverData()
            programArg "--all"
            programArg "--mod"
            programArg "overlayer"
            programArg "--output"
            programArg file("src/generated/resources").absolutePath
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir('src/generated/resources')
            exclude("**/*.bbmodel")
            exclude("**/.cache/**")
        }
    }
}