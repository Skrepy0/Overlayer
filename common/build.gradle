architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    api('com.github.dragon66:icafe:icafe4j-v0.2') {
        exclude group: 'javax.media', module: 'jai_imageio'
    }
    implementation platform("org.lwjgl:lwjgl-bom:3.4.3")

    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-tinyfd"
    implementation('com.github.dragon66:icafe:icafe4j-v0.2') {
        exclude group: 'javax.media', module: 'jai_imageio'
    }
    def lwjglNatives = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "natives-windows" :
            org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "natives-macos" :
                    "natives-linux"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd::$lwjglNatives"
}
