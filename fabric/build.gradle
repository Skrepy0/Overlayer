plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url 'https://jitpack.io' }
    maven {
        name = "MavenCentral"
        url = "https://repo.maven.apache.org/maven2/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def os = org.gradle.internal.os.OperatingSystem.current()
def lwjglNatives = os.isWindows() ? "natives-windows" :
        os.isMacOsX() ? "natives-macos" :
                "natives-linux"

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation platform("org.lwjgl:lwjgl-bom:$rootProject.lwjgl_version")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-tinyfd"

    shadowBundle "org.lwjgl:lwjgl:$rootProject.lwjgl_version"
    shadowBundle "org.lwjgl:lwjgl-glfw:$rootProject.lwjgl_version"
    shadowBundle "org.lwjgl:lwjgl-tinyfd:$rootProject.lwjgl_version"

    runtimeOnly "org.lwjgl:lwjgl:$rootProject.lwjgl_version:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$rootProject.lwjgl_version:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd:$rootProject.lwjgl_version:$lwjglNatives"

    common(project(path: ':common')) {
        transitive = false
    }

    shadowBundle project(
            path: ':common',
            configuration: 'transformProductionFabric'
    )

    implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    implementation("com.github.dragon66:icafe:icafe4j-v0.2") {
        exclude group: 'javax.media', module: 'jai_imageio'
        exclude group: 'org.slf4j'
    }

    shadowBundle("com.github.dragon66:icafe:icafe4j-v0.2") {
        exclude group: 'javax.media', module: 'jai_imageio'
        exclude group: 'org.slf4j'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

sourceSets {
    main {
        resources {
            srcDir('src/generated')
            exclude("**/*.bbmodel")
            exclude("**/.cache/**")
        }
    }
}

loom {
    runs {
        clientData {
            clientData()
            programArg "--all"
            programArg "--mod"
            programArg "overlayer"
            programArg "--output"
            programArg file("src/generated").absolutePath
        }
        serverData {
            serverData()
            programArg "--all"
            programArg "--mod"
            programArg "overlayer"
            programArg "--output"
            programArg file("src/generated").absolutePath
        }
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/native-image/**'
    exclude 'META-INF/maven/**'

    minimize {
        exclude(dependency('com.github.dragon66:icafe:.*'))
    }
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}